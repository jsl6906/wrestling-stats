name: Deploy

on:
  # Run this workflow whenever a new commit is pushed to main.
  push: {branches: [main]}
  # Run this workflow once per week on Monday, at 10:15 UTC
  schedule: [{cron: "15 10 * * 1"}]
  # Run this workflow when triggered manually in GitHub’s UI.
  workflow_dispatch: {}

# Only one run may touch the database / firewall at a time
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Postgres (Entra ID auth; no passwords). Python mints tokens itself via GitHub OIDC.
  PGHOST: ${{ vars.PGHOST }}
  PGDATABASE: ${{ vars.PGDATABASE }}
  PGUSER: ${{ vars.PGUSER }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  PG_RESOURCE_GROUP: ${{ vars.AZURE_PG_RESOURCE_GROUP }}
  PG_SERVER_NAME: ${{ vars.AZURE_PG_SERVER_NAME }}
  FIREWALL_RULE: gh-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Sync uv to get python dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: observable-framework-app/package-lock.json

      - name: Install node dependencies
        working-directory: observable-framework-app
        run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open Postgres firewall for this runner
        run: |
          RUNNER_IP=$(curl -fsS https://api.ipify.org)
          echo "::add-mask::$RUNNER_IP"
          az postgres flexible-server firewall-rule create \
            --resource-group "$PG_RESOURCE_GROUP" --name "$PG_SERVER_NAME" \
            --rule-name "$FIREWALL_RULE" \
            --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" \
            --output none

      - name: Ensure database schema
        run: uv run db/init_schema.py

      - name: Scrape, parse and calculate Elo for every governing body
        run: |
          set -euo pipefail
          jq -c '.[]' governing_bodies.json | while read -r gb; do
            export GOVERNING_BODY_ID=$(jq -r '.id' <<<"$gb")
            export GOVERNING_BODY_ACRONYM=$(jq -r '.acronym' <<<"$gb")
            export GOVERNING_BODY_NAME=$(jq -r '.name' <<<"$gb")
            echo "::group::${GOVERNING_BODY_ACRONYM} — ${GOVERNING_BODY_NAME}"
            uv run code/scrape_tournaments.py --lookback-weeks 1
            uv run code/parse_round_html.py
            uv run code/calculate_elo.py
            echo "::endgroup::"
          done

      - name: Execute the data loaders and build the static Observable Framework site
        working-directory: observable-framework-app
        run: |
          source ../.venv/bin/activate
          npm run build

      - name: Azure re-login (ARM token may have expired during long runs)
        if: always()
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Close Postgres firewall
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$PG_RESOURCE_GROUP" --name "$PG_SERVER_NAME" \
            --rule-name "$FIREWALL_RULE" --yes --output none || true

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: observable-framework-app/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
